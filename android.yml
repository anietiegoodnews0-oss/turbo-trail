name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install tools and libraries
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 three@0.128.0 @fontsource/bungee @fontsource/nunito

      - name: Prepare the game files for offline use
        run: |
          mkdir -p www/lib www/fonts
          cp node_modules/three/build/three.min.js www/lib/
          cp node_modules/three/examples/js/loaders/GLTFLoader.js www/lib/
          cp node_modules/three/examples/js/loaders/FBXLoader.js www/lib/
          cp node_modules/three/examples/js/libs/fflate.min.js www/lib/
          cp node_modules/@fontsource/bungee/files/bungee-latin-400-normal.woff2 www/fonts/
          cp node_modules/@fontsource/nunito/files/nunito-latin-600-normal.woff2 www/fonts/
          cp node_modules/@fontsource/nunito/files/nunito-latin-800-normal.woff2 www/fonts/
          python3 - <<'PY'
          import re
          s = open('index.html', encoding='utf8').read()
          base = 'https://cdn.jsdelivr.net/npm/three@0.128.0/'
          s = s.replace(base + 'build/three.min.js', 'lib/three.min.js')
          s = s.replace(base + 'examples/js/loaders/GLTFLoader.js', 'lib/GLTFLoader.js')
          s = s.replace(base + 'examples/js/loaders/FBXLoader.js', 'lib/FBXLoader.js')
          s = s.replace(base + 'examples/js/libs/fflate.min.js', 'lib/fflate.min.js')
          fonts = '<style>@font-face{font-family:Bungee;src:url(fonts/bungee-latin-400-normal.woff2)}@font-face{font-family:Nunito;font-weight:600;src:url(fonts/nunito-latin-600-normal.woff2)}@font-face{font-family:Nunito;font-weight:800;src:url(fonts/nunito-latin-800-normal.woff2)}</style>'
          s = re.sub(r'<link href="https://fonts.googleapis.com[^>]*>', fonts, s)
          assert 'cdn.jsdelivr' not in s and 'googleapis' not in s, 'an online link is still in the game file'
          open('www/index.html', 'w', encoding='utf8').write(s)
          PY

      - name: Create the Android app
        run: |
          cat > capacitor.config.json <<'JSON'
          {"appId":"com.turbotrail.racers","appName":"Turbo Trail Racers","webDir":"www"}
          JSON
          npx cap add android
          sed -i 's/<activity/<activity android:screenOrientation="sensorLandscape"/' android/app/src/main/AndroidManifest.xml
          npx cap sync android

      - name: Build the APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Publish the APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Turbo Trail Racers build ${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
